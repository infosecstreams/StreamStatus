# Local development. Production runs the service block in
# deploy/docker-compose.streamstatus.yml (see deploy/README.md).
version: "3.7"
services:
  # streamstatus to receive event requests from twitch
  streamstatus:
    image: ${STREAMSTATUS_IMAGE:-ghcr.io/infosecstreams/streamstatus:latest}
    ports:
      - "127.0.0.1:8080:8080"
    env_file: streamstatus.env
    environment:
      SS_DB_PATH: /data/streamstatus.db
    volumes:
      - streamstatus-data:/data
    tmpfs:
      - /tmp
    restart: always
    build:
      context: .
      dockerfile: Dockerfile

volumes:
  streamstatus-data:
