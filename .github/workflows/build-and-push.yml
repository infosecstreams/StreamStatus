name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*'  # This will trigger the workflow on tags that start with 'v'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history so git describe / rev-list can see all tags.
          fetch-depth: 0
          fetch-tags: true

      - name: Log in to GitHub Docker registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Get the latest tag
        id: get_tag
        run: echo "LATEST_TAG=$(git describe --tags `git rev-list --tags --max-count=1`)" >> $GITHUB_ENV

      - name: Set up tags
        id: vars
        run: |
          # github.repository is already "owner/name"; do not prepend the
          # owner again or the image lands in a wrongly nested package.
          REPO_NAME_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION="${{ env.LATEST_TAG }}"
          TAG1="ghcr.io/${REPO_NAME_LOWER}:latest"
          TAG2="ghcr.io/${REPO_NAME_LOWER}:${VERSION}-0-${SHORT_SHA}"

          echo "IMAGE_TAG1=$TAG1" >> $GITHUB_ENV
          echo "IMAGE_TAG2=$TAG2" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          echo "Building Docker images: $IMAGE_TAG1 and $IMAGE_TAG2"
          docker build -t "$IMAGE_TAG1" -t "$IMAGE_TAG2" .

      - name: Push Docker image to GitHub Packages
        run: |
          echo "Pushing Docker images: $IMAGE_TAG1 and $IMAGE_TAG2"
          docker push "$IMAGE_TAG1"
          docker push "$IMAGE_TAG2"
