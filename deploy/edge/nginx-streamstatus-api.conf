# Only if Caddy is NOT adopted: the bot API location for the deployed nginx
# config (~/repos/plausible-docker-compose/nginx/config/nginx.default.conf,
# server p.infosecstreams.com:443), next to the existing /webhook/callbacks
# location. It replaces `location /api/` in deploy/nginx-streamstatus.conf
# (ci-deploy-security), which must not be used: Plausible CE owns /api/*
# (POST /api/event on every pageview, /api/stats/<domain>/..., /api/v1|v2)
# and /live/* (LiveView /live/websocket, /live/longpoll). Per CONTRACT.md the
# bot API lives under /streamstatus/.
#
# Relies on the `resolver 127.0.0.11 valid=10s;` already in that server block.
# nginx still gets no HTTP/3 or brotli this way: the Chainguard image on the
# host is built without --with-http_v3_module and without ngx_brotli.

location /streamstatus/ {
    limit_except GET { deny all; }   # GET implies HEAD
    set $streamstatus_upstream http://streamstatus:8080;
    proxy_pass $streamstatus_upstream;   # no URI part: the path is passed as is
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
}
