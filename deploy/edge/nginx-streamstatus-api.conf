# Only if Caddy is NOT adopted: a corrected drop-in for the `location /api/`
# block in deploy/nginx-streamstatus.conf (ci-deploy-security branch).
#
# Why: Plausible on the same host owns most of /api/ (POST /api/event is
# every pageview, plus /api/health, /api/stats/<domain>/<metric> for the
# dashboard, /api/v1/..., /api/v2/..., /api/docs/query/schema.json).
# A prefix `location /api/` sends all of that to the bot, which answers 404,
# so analytics stops recording. This regex matches only the bot's path shapes:
# /api/<name>.json, /api/<name>.ics and /api/stats/<id|login>.json.
#
# nginx still has no HTTP/3 or brotli in the Chainguard image used on the
# host (nginx 1.31.9 built without --with-http_v3_module or ngx_brotli).

location ~ ^/api/([a-z0-9_-]+\.(json|ics)|stats/[^/]+\.json)$ {
    limit_except GET { deny all; }   # GET implies HEAD
    proxy_pass $streamstatus_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
}
