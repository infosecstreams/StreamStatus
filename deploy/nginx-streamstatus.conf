# nginx locations for StreamStatus on p.infosecstreams.com.
# Put these inside the existing `server { listen 443 ssl; server_name p.infosecstreams.com; ... }`
# block, replacing the current /webhook/callbacks location. See deploy/README.md.

# Resolve the container through Docker's DNS at request time, so a
# recreated streamstatus container (new IP after a deploy) is picked up
# without reloading nginx. With a literal `proxy_pass http://streamstatus:8080`
# nginx resolves once at startup and can keep sending to a dead IP.
resolver 127.0.0.11 valid=10s ipv6=off;
set $streamstatus_upstream http://streamstatus:8080;

# Twitch EventSub webhooks.
location = /webhook/callbacks {
    limit_except POST { deny all; }
    client_max_body_size 64k;
    proxy_pass $streamstatus_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
}

# Public read-only JSON/ICS API: /api/status.json, /api/schedule.json,
# /api/schedule.ics. The bot sets Content-Type, Cache-Control
# (max-age=15, schedule 300), ETag, CORS and gzip itself; nginx passes all
# of them, plus the client's If-None-Match and Accept-Encoding, through
# untouched. Do not add_header Cache-Control/CORS here: that would duplicate
# the bot's headers.
location /api/ {
    limit_except GET { deny all; }   # GET implies HEAD
    proxy_pass $streamstatus_upstream;   # no URI part: /api/... is passed as is
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;

    # Optional micro-cache that absorbs traffic spikes and keeps serving the
    # last good copy for a minute if the bot is restarting. It honours the
    # bot's Cache-Control and Vary: Accept-Encoding. Needs this once in the
    # http {} context (e.g. conf.d/streamstatus-cache.conf):
    #   proxy_cache_path /var/cache/nginx/streamstatus levels=1:2 keys_zone=streamstatus_api:1m max_size=50m inactive=10m use_temp_path=off;
    # proxy_cache streamstatus_api;
    # proxy_cache_lock on;
    # proxy_cache_use_stale error timeout updating http_502 http_503 http_504;
    # proxy_cache_background_update on;
    # add_header X-Cache-Status $upstream_cache_status always;
}
